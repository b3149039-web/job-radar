name: Deploy JobRadar Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobradar-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
          run_install: false
      - name: Check Git history for private files
        run: python -B tools/pages.py audit-git
      - name: Install pinned browser dependency
        run: pnpm install --prod --frozen-lockfile --ignore-scripts
      - uses: actions/configure-pages@v5
      - name: Build and audit the allowlisted artifact
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: python -B tools/pages.py build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/job-radar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the audited artifact
        id: deployment
        uses: actions/deploy-pages@v4
