name: JobRadar staging sync acceptance

on:
  workflow_dispatch:
    inputs:
      real_collection:
        description: Run public collection and apply it to staging after acceptance
        type: boolean
        default: false
      verify_production_path:
        description: With real_collection, verify the new writer on staging and roll back all job writes
        type: boolean
        default: false
      insert_only:
        description: When verifying the production path, defer all updates to existing jobs
        type: boolean
        default: false
      verify_writer_fixture:
        description: Verify insert, update, replay and rollback with one synthetic job in staging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jobradar-staging-sync
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: jobradar-staging
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -p 'test_staging_sync.py'
      - run: python -m pip install --disable-pip-version-check -r requirements-jobs.txt
      - name: Simulated batch, real staging permissions and rollback
        env:
          JOBRADAR_JOBS_DSN: ${{ secrets.JOBRADAR_JOBS_DSN }}
          JOBRADAR_JOBS_CA_PEM: ${{ secrets.JOBRADAR_JOBS_CA_PEM }}
          JOBRADAR_STAGING_PROJECT_REF: ${{ vars.JOBRADAR_STAGING_PROJECT_REF }}
          JOBRADAR_PRODUCTION_PROJECT_REF: ${{ vars.JOBRADAR_PRODUCTION_PROJECT_REF }}
          JOBRADAR_STAGING_PROTECTED_IDS: ${{ vars.JOBRADAR_STAGING_PROTECTED_IDS }}
          VERIFY_WRITER_FIXTURE: ${{ inputs.verify_writer_fixture }}
        run: |
          umask 077
          export JOBRADAR_JOBS_CA_FILE="$(mktemp "$RUNNER_TEMP/jobradar-ca.XXXXXX")"
          trap 'rm -f -- "$JOBRADAR_JOBS_CA_FILE"' EXIT
          printf '%s\n' "$JOBRADAR_JOBS_CA_PEM" > "$JOBRADAR_JOBS_CA_FILE"
          unset JOBRADAR_JOBS_CA_PEM
          mkdir -p dist
          if [ "$VERIFY_WRITER_FIXTURE" = "true" ]; then
            python -B tools/staging_sync.py --verify-writer-fixture --output dist/staging-acceptance.md
          else
            python -B tools/staging_sync.py --output dist/staging-acceptance.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-acceptance
          path: dist/staging-acceptance.md

  collect:
    needs: acceptance
    if: inputs.real_collection && !inputs.verify_writer_fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -B tools/collect_jobs.py --output dist/daily-collection.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-collection
          path: dist/daily-collection.json

  write:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: jobradar-staging
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: staging-collection
          path: dist
      - run: python -m pip install --disable-pip-version-check -r requirements-jobs.txt
      - name: Apply and replay the same report in staging
        env:
          JOBRADAR_JOBS_DSN: ${{ secrets.JOBRADAR_JOBS_DSN }}
          JOBRADAR_JOBS_CA_PEM: ${{ secrets.JOBRADAR_JOBS_CA_PEM }}
          JOBRADAR_STAGING_PROJECT_REF: ${{ vars.JOBRADAR_STAGING_PROJECT_REF }}
          JOBRADAR_PRODUCTION_PROJECT_REF: ${{ vars.JOBRADAR_PRODUCTION_PROJECT_REF }}
          JOBRADAR_STAGING_PROTECTED_IDS: ${{ vars.JOBRADAR_STAGING_PROTECTED_IDS }}
          VERIFY_PRODUCTION_PATH: ${{ inputs.verify_production_path }}
          INSERT_ONLY: ${{ inputs.insert_only }}
        run: |
          umask 077
          export JOBRADAR_JOBS_CA_FILE="$(mktemp "$RUNNER_TEMP/jobradar-ca.XXXXXX")"
          trap 'rm -f -- "$JOBRADAR_JOBS_CA_FILE"' EXIT
          printf '%s\n' "$JOBRADAR_JOBS_CA_PEM" > "$JOBRADAR_JOBS_CA_FILE"
          unset JOBRADAR_JOBS_CA_PEM
          if [ "$VERIFY_PRODUCTION_PATH" = "true" ]; then
            mode=()
            if [ "$INSERT_ONLY" = "true" ]; then mode+=(--insert-only); fi
            python -B tools/production_sync.py --verify-staging "${mode[@]}" --report dist/daily-collection.json --output dist/staging-write.md
          else
            python -B tools/staging_sync.py --apply dist/daily-collection.json --output dist/staging-write.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-write
          path: dist/staging-write.md
